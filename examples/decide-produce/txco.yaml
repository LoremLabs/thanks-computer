# examples/decide-produce — typed decisions with ai://decide.
#
# Type a food into the page; one ai://decide call asks four bounded
# questions about it (is it produce? which kind? how sweet? eaten raw?) and
# the next scope's WHEN clauses turn the probabilities into an answer. The
# model only judges — every threshold lives in 200/*.txcl.
#
# Try it (against a running chassis — `txco dev` in this directory):
#
#   txco auth tenant secrets set VERCEL_AI_KEY   # or: export VERCEL_AI_KEY=… before txco dev
#   txco apply
#   open http://<the produce URL txco dev printed>/
#   curl 'http://<that host>/classify?item=tomato'

target: dev

targets:
  dev:
    chassis: http://localhost:8081
    mock: allow
